[package]
name    = "git-remote-refs-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
git-remote-refs = { path = "../.." }
js-sys          = "=0.3.107"
serde           = { version = "1", features = ["derive"] }
serde_bytes     = "0.11"
tsify           = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen    = "=0.2.130"
