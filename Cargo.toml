[package]
name          = "git-remote-refs"
version       = { workspace = true }
authors       = { workspace = true }
edition       = { workspace = true }
description   = "I/O-free, no_std Rust library for listing refs and fetching objects over Git smart HTTP."
documentation = "https://docs.rs/git-remote-refs"
readme        = { workspace = true }
repository    = { workspace = true }
license       = { workspace = true }
keywords      = ["git", "git-protocol", "ls-remote", "smart-http", "wasm"]
categories    = ["development-tools", "network-programming", "no-std", "parser-implementations", "wasm"]
include       = ["/src/**", "/tests/**", "/Cargo.toml", "/LICENSE", "/README.md"]
publish       = ["crates-io"]

[dependencies]
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
sha1        = { version = "0.11.0", default-features = false }
sha2        = { version = "0.11.1", default-features = false }

[workspace]
package.version    = "0.1.0"
package.authors    = ["Kaj Kowalski"]
package.edition    = "2024"
package.readme     = "README.md"
package.repository = "https://github.com/kjanat/git-remote-refs"
package.license    = "MIT"
resolver           = "3"
members            = [".", "bindings/component", "bindings/wasm"]

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3
