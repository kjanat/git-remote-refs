name: Release
run-name: ${{ inputs.beepboop_title || 'Release' }}

on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop execution
        type: string
        required: true
      beepboop_title:
        description: Beepboop run title
        type: string
        required: false

permissions: { contents: read }

defaults: { run: { shell: "bash --noprofile --norc -euo pipefail {0}" } }

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  source:
    name: Identify the approved release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ fromJSON(steps.beepboop.outputs.context).version }}
      ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: git-remote-refs
          operation: promote

      - name: Require a stable release version
        env:
          VERSION: ${{ fromJSON(steps.beepboop.outputs.context).version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable MAJOR.MINOR.PATCH release version"
            exit 1
          fi

  checks:
    name: Checks
    needs: source
    uses: $/.github/workflows/checks.yml
    with: { ref: "${{ needs.source.outputs.ref }}" }

  crates-io:
    name: Publish to crates.io
    needs: [source, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/git-remote-refs/${{ needs.source.outputs.version }}
    permissions: { contents: read, id-token: write }
    env: { VERSION: "${{ needs.source.outputs.version }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: packages }

      - name: Check crates.io
        id: registry
        env:
          url: "https://crates.io/api/v1/crates/git-remote-refs/${{ needs.source.outputs.version }}"
          registry: crates.io
          version: "${{ needs.source.outputs.version }}"
        run: |
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' --user-agent "${GITHUB_REPOSITORY} release" "${url}")"
          case "${status}" in
            200) echo "published=true"  >> "${GITHUB_OUTPUT}" ;;
            404) echo "published=false" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::${registry} answered HTTP ${status} for git-remote-refs ${version}"
              exit 1
              ;;
          esac

      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          stream: git-remote-refs
          operation: promote
          execution-id: ${{ inputs.beepboop_execution_id }}

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.beepboop.outcome == 'success' && steps.registry.outputs.published == 'false'
        continue-on-error: true

      - uses: kjanat/beepboop/actions/credentials@v1
        id: credentials
        if: steps.auth.outcome == 'failure'
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          aliases: '["crates-io"]'

      - name: Publish to crates.io
        id: publish
        if: steps.beepboop.outcome == 'success' && steps.registry.outputs.published == 'false'
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token || fromJSON(steps.credentials.outputs.values || '{}')['crates-io'] }}" }
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          output="$(cargo publish --locked --package git-remote-refs 2>&1)"
          code=$?
          echo "$output"
          if (( code != 0 )) && [[ "$output" == *"already exists"* || "$output" == *"is already uploaded"* ]]; then
            echo "::notice::crates.io already has git-remote-refs $VERSION"
            code=0
          fi
          exit "$code"

      - name: Verify the published artifact
        id: verify
        run: |
          artifact="packages/git-remote-refs-$VERSION.crate"
          expected="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          index=https://index.crates.io/gi/t-/git-remote-refs
          for attempt in {1..6}; do
            actual="$(curl --silent --show-error --fail --retry 3 "$index" |
              jq -r --arg version "$VERSION" 'select(.vers == $version and .yanked == false) | .cksum')"
            [[ -z "$actual" && "$attempt" != 6 ]] || break
            sleep 5
          done
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Published artifact does not match the artifact built from the approved commit"
            exit 1
          fi

      - uses: kjanat/beepboop/actions/report@v1
        if: ${{ !cancelled() && steps.beepboop.outcome == 'success' }}
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          publications: |
            [{
              "id": "pkg:cargo/git-remote-refs",
              "manager": "cargo",
              "name": "git-remote-refs",
              "version": "${{ env.VERSION }}",
              "required": true,
              "outcome": "${{ case(steps.verify.outcome == 'success', 'succeeded', 'failed') }}"
            }]

  npm:
    name: Publish to npm
    needs: [source, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/git-remote-refs/v/${{ needs.source.outputs.version }}
    permissions: { contents: read, id-token: write }
    env: { VERSION: "${{ needs.source.outputs.version }}" }
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: packages }

      - name: Check npm
        id: registry
        env:
          url: "https://registry.npmjs.org/git-remote-refs/${{ needs.source.outputs.version }}"
          registry: npm
          version: "${{ needs.source.outputs.version }}"
        run: |
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "${url}")"
          case "${status}" in
            200) echo "published=true"  >> "${GITHUB_OUTPUT}" ;;
            404) echo "published=false" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::the ${registry} registry answered HTTP ${status} for git-remote-refs ${version}"
              exit 1
              ;;
          esac

      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          stream: git-remote-refs
          operation: promote
          execution-id: ${{ inputs.beepboop_execution_id }}

      - name: Publish with trusted publishing
        id: oidc
        if: steps.beepboop.outcome == 'success' && steps.registry.outputs.published == 'false'
        continue-on-error: true
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          output="$(npm publish "./packages/git-remote-refs-$VERSION.tgz" --access public --ignore-scripts 2>&1)"
          code=$?
          echo "${output}"
          if (( code != 0 )) && [[ "${output}" == *"cannot publish over the previously published versions"* ]]; then
            echo "::notice::npm already has git-remote-refs $VERSION"
            code=0
          fi
          exit "${code}"

      - uses: kjanat/beepboop/actions/credentials@v1
        id: credentials
        if: steps.oidc.outcome == 'failure'
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          aliases: '["npm-token"]'

      - name: Publish with a token
        id: token
        if: steps.oidc.outcome == 'failure'
        env: { NODE_AUTH_TOKEN: "${{ fromJSON(steps.credentials.outputs.values || '{}')['npm-token'] }}" }
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          output="$(npm publish "./packages/git-remote-refs-$VERSION.tgz" --access public --ignore-scripts 2>&1)"
          code=$?
          echo "$output"
          if (( code != 0 )) && [[ "$output" == *"cannot publish over the previously published versions"* ]]; then
            echo "::notice::npm already has git-remote-refs $VERSION"
            code=0
          fi
          exit "$code"

      - name: Verify the published artifact
        id: verify
        run: |
          artifact="packages/git-remote-refs-$VERSION.tgz"
          expected="sha512-$(openssl dgst -sha512 -binary "$artifact" | openssl base64 -A)"
          url="https://registry.npmjs.org/git-remote-refs/$VERSION"
          actual="$(curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 5 "$url" |
            jq -er '.dist.integrity')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Published artifact does not match the artifact built from the approved commit"
            exit 1
          fi

      - uses: kjanat/beepboop/actions/report@v1
        if: ${{ !cancelled() && steps.beepboop.outcome == 'success' }}
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          publications: |
            [{
              "id": "pkg:npm/git-remote-refs",
              "manager": "npm",
              "name": "git-remote-refs",
              "version": "${{ env.VERSION }}",
              "required": true,
              "outcome": "${{ case(steps.verify.outcome == 'success', 'succeeded', 'failed') }}"
            }]

  github-release:
    name: Publish the GitHub release
    needs: [source, crates-io, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    env: { TAG: "v${{ needs.source.outputs.version }}" }
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: git-remote-refs
          operation: promote

      - uses: kjanat/beepboop/actions/token@v1
        id: token
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.source.outputs.ref }}", persist-credentials: false }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: packages }

      - uses: kjanat/beepboop/actions/publish-refs@v1
        env: { "${{ insert }}": "${{ fromJSON(steps.token.outputs.gitId || '{}') }}" }
        with: { token: "${{ steps.token.outputs.token }}" }

      - name: Fetch the Go module through the proxy
        run: curl --silent --show-error --fail --retry 5 --retry-delay 10 --retry-all-errors
          "https://proxy.golang.org/github.com/kjanat/git-remote-refs/go/@v/${TAG}.info"

      - name: Publish the GitHub release
        env: { GH_TOKEN: "${{ steps.token.outputs.token }}" }
        run: |
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}";
          files=(./packages/*.crate ./packages/*.tgz ./packages/git-remote-refs.component.wasm);
          if gh release view "${TAG}" --json tagName; then gh release upload "${TAG}" "${files[@]}" --clobber;
          else gh release create "${TAG}" "${files[@]}" --verify-tag --notes-from-tag --title "${TAG}"; fi
