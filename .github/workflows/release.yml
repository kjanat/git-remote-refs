name: Release
run-name: ${{ inputs.dry-run && 'Dry run' || 'Release' }} ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.2.3
        type: string
        required: true
      dry-run:
        description: Check and package without publishing
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Verify the tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
      go-tag: ${{ steps.verify.outputs.go-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Verify the tags and versions
        id: verify
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          if [[ "$TAG" != v* || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          go_ref="refs/pending/go/$TAG"
          if [[ -n "$(git ls-remote origin "refs/tags/go/$TAG")" ]]; then
            go_ref="refs/tags/go/$TAG"
          fi
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" "+$go_ref:refs/tags/go/$TAG"
          curl --silent --show-error --fail --location "https://github.com/$OWNER.gpg" | gpg --batch --import
          for name in "$TAG" "go/$TAG"; do
            if [[ "$(git cat-file -t "refs/tags/$name")" != tag ]]; then
              echo "::error::$name is not an annotated tag"
              exit 1
            fi
            if [[ "$(git for-each-ref --format='%(tag)' "refs/tags/$name")" != "$name" ]]; then
              echo "::error::refs/tags/$name holds a tag object named $(git for-each-ref --format='%(tag)' "refs/tags/$name")"
              exit 1
            fi
            git verify-tag "$name"
          done
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [[ "$(git rev-parse "refs/tags/go/$TAG^{commit}")" != "$sha" ]]; then
            echo "::error::go/$TAG and $TAG point at different commits"
            exit 1
          fi
          cargo="$(yq --input-format toml --output-format yaml '.workspace.package.version' Cargo.toml)"
          npm="$(jq --raw-output .version package.json)"
          if [[ "$cargo" != "$version" || "$npm" != "$version" ]]; then
            echo "::error::$TAG needs version $version, but Cargo.toml has $cargo and package.json has $npm"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "sha=$sha"
            echo "go-tag=$(git rev-parse "refs/tags/go/$TAG")"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: tag
    uses: $/.github/workflows/checks.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}

  crates-io:
    name: Publish to crates.io
    needs: [tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/git-remote-refs/${{ needs.tag.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Check crates.io
        id: registry
        run: |
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            --user-agent "$GITHUB_REPOSITORY release" \
            "https://crates.io/api/v1/crates/git-remote-refs/$VERSION")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered HTTP $status for git-remote-refs $VERSION"
              exit 1
              ;;
          esac

      - name: Package for crates.io
        if: env.DRY_RUN == 'true'
        run: cargo publish --locked --dry-run --package git-remote-refs

      - uses: kjanat/beepboop/actions/begin@6a16e1e7731247f029348aab8fa2e3e8990763ef # v1.10.20
        id: beepboop
        if: env.DRY_RUN == 'false' && steps.registry.outputs.published == 'false'
        with:
          stream: git-remote-refs
          operation: release
          version: ${{ env.VERSION }}

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.beepboop.outcome == 'success'
        continue-on-error: true

      - uses: kjanat/beepboop/actions/credentials@6a16e1e7731247f029348aab8fa2e3e8990763ef # v1.10.20
        id: credentials
        if: steps.auth.outcome == 'failure'
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          aliases: '["crates-io"]'

      - name: Publish to crates.io
        id: publish
        if: steps.beepboop.outcome == 'success'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || fromJSON(steps.credentials.outputs.values || '{}')['crates-io'] }}
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          output="$(cargo publish --locked --package git-remote-refs 2>&1)"
          code=$?
          echo "$output"
          if (( code != 0 )) && [[ "$output" == *"already exists"* || "$output" == *"is already uploaded"* ]]; then
            echo "::notice::crates.io already has git-remote-refs $VERSION"
            code=0
          fi
          exit "$code"

      - uses: kjanat/beepboop/actions/report@6a16e1e7731247f029348aab8fa2e3e8990763ef # v1.10.20
        if: ${{ !cancelled() && steps.beepboop.outcome == 'success' }}
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          publications: |
            [{
              "id": "pkg:cargo/git-remote-refs",
              "manager": "cargo",
              "name": "git-remote-refs",
              "version": "${{ env.VERSION }}",
              "required": true,
              "outcome": "${{ steps.publish.outcome == 'success' && 'succeeded' || 'failed' }}"
            }]

  npm:
    name: Publish to npm
    needs: [tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/git-remote-refs/v/${{ needs.tag.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Check npm
        id: registry
        run: |
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/git-remote-refs/$VERSION")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::the npm registry answered HTTP $status for git-remote-refs $VERSION"
              exit 1
              ;;
          esac

      - name: Package for npm
        if: env.DRY_RUN == 'true'
        run: npm publish "./packages/git-remote-refs-$VERSION.tgz" --dry-run --access public --ignore-scripts

      - uses: kjanat/beepboop/actions/begin@6a16e1e7731247f029348aab8fa2e3e8990763ef # v1.10.20
        id: beepboop
        if: env.DRY_RUN == 'false' && steps.registry.outputs.published == 'false'
        with:
          stream: git-remote-refs
          operation: release
          version: ${{ env.VERSION }}

      - name: Publish with trusted publishing
        id: oidc
        if: steps.beepboop.outcome == 'success'
        continue-on-error: true
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          output="$(npm publish "./packages/git-remote-refs-$VERSION.tgz" --access public --ignore-scripts 2>&1)"
          code=$?
          echo "$output"
          if (( code != 0 )) && [[ "$output" == *"cannot publish over the previously published versions"* ]]; then
            echo "::notice::npm already has git-remote-refs $VERSION"
            code=0
          fi
          exit "$code"

      - uses: kjanat/beepboop/actions/credentials@6a16e1e7731247f029348aab8fa2e3e8990763ef # v1.10.20
        id: credentials
        if: steps.oidc.outcome == 'failure'
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          aliases: '["npm-token"]'

      - name: Publish with a token
        id: token
        if: steps.oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ fromJSON(steps.credentials.outputs.values || '{}')['npm-token'] }}
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          output="$(npm publish "./packages/git-remote-refs-$VERSION.tgz" --access public --ignore-scripts 2>&1)"
          code=$?
          echo "$output"
          if (( code != 0 )) && [[ "$output" == *"cannot publish over the previously published versions"* ]]; then
            echo "::notice::npm already has git-remote-refs $VERSION"
            code=0
          fi
          exit "$code"

      - uses: kjanat/beepboop/actions/report@6a16e1e7731247f029348aab8fa2e3e8990763ef # v1.10.20
        if: ${{ !cancelled() && steps.beepboop.outcome == 'success' }}
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          publications: |
            [{
              "id": "pkg:npm/git-remote-refs",
              "manager": "npm",
              "name": "git-remote-refs",
              "version": "${{ env.VERSION }}",
              "required": true,
              "outcome": "${{ (steps.oidc.outcome == 'success' || steps.token.outcome == 'success') && 'succeeded' || 'failed' }}"
            }]

  github-release:
    name: Publish the GitHub release
    needs: [tag, crates-io, npm]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Publish the go/ tag
        env:
          GO_TAG: ${{ needs.tag.outputs.go-tag }}
        run: |
          if current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/go/$TAG" --jq .object.sha)"; then
            if [[ "$current" != "$GO_TAG" ]]; then
              echo "::error::go/$TAG points at $current instead of the verified tag object $GO_TAG"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/go/$TAG" -f "sha=$GO_TAG"
          fi

      - name: Fetch the Go module through the proxy
        run: |
          curl --silent --show-error --fail --retry 5 --retry-delay 10 --retry-all-errors \
            "https://proxy.golang.org/github.com/kjanat/git-remote-refs/go/@v/$TAG.info"

      - name: Publish the GitHub release
        run: |
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          files=(packages/*.crate packages/*.tgz packages/git-remote-refs.component.wasm)
          if gh release view "$TAG" --json tagName; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --notes-from-tag --title "$TAG"
          fi
