name: Release
run-name: ${{ inputs.beepboop_title || 'Release' }}

on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop execution
        type: string
        required: true
      release_operation:
        type: string
        default: promote
      beepboop_title:
        description: Beepboop run title
        type: string
        required: false

permissions: { contents: read }

defaults: { run: { shell: "bash --noprofile --norc -euo pipefail {0}" } }

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  source:
    name: Identify the approved release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ fromJSON(steps.beepboop.outputs.context).version }}
      ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: git-remote-refs
          operation: ${{ inputs.release_operation }}

      - name: Require a stable release version
        env:
          VERSION: ${{ fromJSON(steps.beepboop.outputs.context).version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable MAJOR.MINOR.PATCH release version"
            exit 1
          fi

  checks:
    name: Checks
    needs: source
    uses: $/.github/workflows/checks.yml
    with: { ref: "${{ needs.source.outputs.ref }}" }

  crates-io:
    if: inputs.release_operation == 'promote'
    name: Publish to crates.io
    needs: [source, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/git-remote-refs/${{ needs.source.outputs.version }}
    permissions: { contents: read, id-token: write }
    env: { VERSION: "${{ needs.source.outputs.version }}" }
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          stream: git-remote-refs
          operation: promote
          execution-id: ${{ inputs.beepboop_execution_id }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        continue-on-error: true

      - uses: kjanat/beepboop/actions/publish@v1
        if: steps.auth.outcome == 'success'
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}" }
        with: { execution-id: "${{ steps.beepboop.outputs.execution-id }}" }

      - uses: kjanat/beepboop/actions/publish@v1
        if: steps.auth.outcome == 'failure'
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          credentials: '{"CARGO_REGISTRY_TOKEN":"crates-io"}'

  npm:
    if: inputs.release_operation == 'npm'
    name: Publish to npm
    needs: [source, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/git-remote-refs/v/${{ needs.source.outputs.version }}
    permissions: { contents: read, id-token: write }
    env: { VERSION: "${{ needs.source.outputs.version }}" }
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          stream: git-remote-refs
          operation: npm
          execution-id: ${{ inputs.beepboop_execution_id }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: packages }

      - uses: kjanat/beepboop/actions/publish@v1
        id: trusted
        continue-on-error: true
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          npm-tarballs: packages

      - uses: kjanat/beepboop/actions/publish@v1
        if: steps.trusted.outcome == 'failure'
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          npm-tarballs: packages
          credentials: '{"NODE_AUTH_TOKEN":"npm-token"}'

  github-release:
    if: inputs.release_operation == 'github-release'
    name: Publish the GitHub release
    needs: [source, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    env: { TAG: "v${{ needs.source.outputs.version }}" }
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: git-remote-refs
          operation: github-release

      - uses: kjanat/beepboop/actions/token@v1
        id: token
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.source.outputs.ref }}", persist-credentials: false }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: packages, path: packages }

      - uses: kjanat/beepboop/actions/publish-refs@v1
        env: { "${{ insert }}": "${{ fromJSON(steps.token.outputs.gitId || '{}') }}" }
        with: { token: "${{ steps.token.outputs.token }}" }

      - name: Fetch the Go module through the proxy
        run: curl --silent --show-error --fail --retry 5 --retry-delay 10 --retry-all-errors
          "https://proxy.golang.org/github.com/kjanat/git-remote-refs/go/@v/${TAG}.info"

      - name: Upload release assets to the draft
        env: { GH_TOKEN: "${{ steps.token.outputs.token }}" }
        run: gh release upload "${TAG}" ./packages/*.crate ./packages/*.tgz ./packages/git-remote-refs.component.wasm --clobber

      - uses: kjanat/beepboop/actions/publish-release@v1
        with: { execution-id: "${{ steps.beepboop.outputs.execution-id }}" }
