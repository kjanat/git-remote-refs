name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: node,npm,github:wasm-bindgen/wasm-bindgen,npm:tsrs,wasm-tools,go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false

      - name: Build
        run: |
          npm ci --ignore-scripts
          mise run build ::: component:build
          mise run go:generate
          git diff --exit-code

      - name: Test
        run: |
          tsrs --project tsconfig.json
          cargo test --locked --workspace
          node --test index.test.ts
          go -C go test -race ./...

      - name: Package
        run: |
          packages="$RUNNER_TEMP/packages"
          mkdir -p "$packages"
          cargo package --locked --package git-remote-refs
          cp target/package/git-remote-refs-*.crate "$packages/"
          npm pack --ignore-scripts --pack-destination "$packages"
          cp go/git-remote-refs.wasm "$packages/git-remote-refs.component.wasm"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
