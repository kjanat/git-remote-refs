name: Checks

on:
  workflow_call:
    outputs:
      artifact-id:
        description: ID of the tested release packages
        value: ${{ jobs.checks.outputs.artifact-id }}
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: kjanat/mise-action@v6
        with: { cache: false }

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Build
        run: |
          npm ci --ignore-scripts
          mise run build ::: component:build
          mise run go:generate
          git diff --exit-code

      - name: Test
        run: mise run test

      - name: Package
        env: { packages: &pkgs "${{ runner.temp }}/packages" }
        run: |
          mkdir -p "${packages}"
          cargo package --locked --package git-remote-refs
          cp target/package/git-remote-refs-*.crate "${packages}/"
          npm pack --ignore-scripts --pack-destination "${packages}"
          cp go/git-remote-refs.wasm "${packages}/git-remote-refs.component.wasm"

      - id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: *pkgs
          if-no-files-found: error
