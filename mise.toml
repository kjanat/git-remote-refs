#:tombi toml-version = "v1.1.0"

[tools]
npm                                = "12"
node                               = "26"
cargo-binstall                     = "1.28.0"
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
"cargo:cargo-nextest"              = "0.9.152"
"npm:tsrs"                         = "7.1.0-beta.tsrs5"
wasm-tools                         = "1.263.0"
go                                 = "1.27.4"
golangci-lint                      = "2.15.0"
"npm:@kjanat/fmt"                  = {
  version               = "0.64.1",
  trust_policy_excludes = ["@kprint/*", "@kjanat/*"],
  allow_low_downloads   = true,
}
"npm:@kjanat/beepboop"             = {
  version             = "0.7.2",
  allow_low_downloads = true,
  auto_update         = true,
  lazy_bins           = "beepboop",
  lazy                = true
}

[settings]
experimental                        = true
idiomatic_version_file_enable_tools = ["go", "rust", "node", "bun"]

[vars]
target    = "wasm32-unknown-unknown"
profile   = "release"
outdir    = "wasm"
component = "go/git-remote-refs.wasm"
rustflags = "--remap-path-prefix={{env.HOME}}=~ --remap-path-prefix={{config_root}}=."

[deps]
npm.auto = true
go.auto  = true

[tasks]
jstest.run    = "node --test index.test.ts"
jstypes.run   = "tsrs -p tsconfig.json"
rstest.vars   = { cargo_locked = "{% if env.CI | default(value='false') == 'true' %} --locked{% endif %}" }
rstest.run    = "cargo nextest run{{vars.cargo_locked}} --workspace"
fmt           = { run = "kfmt", alias = ["f", "format"] }
golint.run    = "golangci-lint run ./go/..."
gotest.run    = "go test -race ./go/..."
"go:generate" = { run = "go -C go generate ./..." }

[tasks.test]
run     = [
  { task = "jstypes" },
  { task = "jstest" },
  { task = "rstest" },
  { task = "gotest" },
  { task = "golint" },
]
depends = ["build", "component:build"]

[tasks."cargo:build"]
vars = { cargo_locked = "{% if env.CI | default(value='false') == 'true' %} --locked{% endif %}" }
env  = { RUSTFLAGS = "{{vars.rustflags}}" }
run  = "cargo build{{vars.cargo_locked}} --package git-remote-refs-wasm --profile {{vars.profile}} --target {{vars.target}}"
hide = true

[tasks."wasm-bindgen:build"]
run     = "wasm-bindgen --target web --out-dir {{vars.outdir}} target/{{vars.target}}/{{vars.profile}}/git_remote_refs_wasm.wasm"
depends = "cargo:build"
hide    = true

[tasks.build]
run     = "tsrs --project tsconfig.build.json"
depends = "wasm-bindgen:build"

[tasks."component:build"]
vars = { cargo_locked = "{% if env.CI | default(value='false') == 'true' %} --locked{% endif %}" }
env  = { RUSTFLAGS = "{{vars.rustflags}}" }
run  = [
  "cargo build{{vars.cargo_locked}} --package git-remote-refs-component --profile {{vars.profile}} --target {{vars.target}}",
  "wasm-tools component new target/{{vars.target}}/{{vars.profile}}/git_remote_refs_component.wasm --output {{vars.component}}",
]

[tasks.version]
description = "Set the version in the manifests and lockfiles"
usage       = 'arg "<version>" help="MAJOR.MINOR.PATCH"'
run         = '''
#!/usr/bin/env bash
set -euo pipefail
version="$usage_version"
if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
  echo "error: $version is not MAJOR.MINOR.PATCH" >&2
  exit 1
fi
sed --in-place --regexp-extended "s/^(package\.version +=) \"[^\"]*\"/\1 \"$version\"/" Cargo.toml
if [[ "$(yq --input-format toml --output-format yaml '.workspace.package.version' Cargo.toml)" != "$version" ]]; then
  echo "error: Cargo.toml has no workspace package.version line to update" >&2
  exit 1
fi
cargo update --workspace
npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
'''

[tasks.release]
description = "Tag a version whose commit passed CI and push the tags"
usage       = '''
arg "<version>" help="Version in the manifests, without the v"
arg "[summary]" help="Summary line for the tag message"
'''
run         = '''
#!/usr/bin/env bash
set -euo pipefail
version="$usage_version"
summary="${usage_summary:-}"
tag="v$version"
fail() {
  echo "error: $1" >&2
  exit 1
}
status() {
  curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' --user-agent "git-remote-refs release" "$1"
}
granted() {
  beepboop secrets list --json | jq --exit-status --arg repo "$repo" --arg alias "$1" --arg environment "$2" \
    'any(.grants[]; .repository == $repo and .alias == $alias and .operation == "release" and .environment == $environment)'
}
[[ "$(git branch --show-current)" == master ]] || fail "check out master first"
git diff --quiet && git diff --cached --quiet || fail "commit or stash your changes first"
git fetch --quiet origin master
sha="$(git rev-parse HEAD)"
[[ "$sha" == "$(git rev-parse origin/master)" ]] || fail "master differs from origin/master"
cargo="$(yq --input-format toml --output-format yaml '.workspace.package.version' Cargo.toml)"
npm="$(jq --raw-output .version package.json)"
[[ "$cargo" == "$version" && "$npm" == "$version" ]] || fail "Cargo.toml has $cargo and package.json has $npm, run mise run version $version and commit it"
for name in "$tag" "go/$tag"; do
  ! git show-ref --quiet --verify "refs/tags/$name" || fail "$name exists locally"
done
[[ -z "$(git ls-remote origin "refs/tags/$tag" "refs/tags/go/$tag" "refs/pending/go/$tag")" ]] || fail "$tag or go/$tag exists on origin"
repo="$(gh repo view --json nameWithOwner --jq .nameWithOwner)"
passed="$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq .total_count)"
(( passed > 0 )) || fail "CI has not passed on $sha"
[[ "$(status "https://crates.io/api/v1/crates/git-remote-refs/$version")" == 404 ]] || fail "crates.io already has git-remote-refs $version"
[[ "$(status "https://registry.npmjs.org/git-remote-refs/$version")" == 404 ]] || fail "npm already has git-remote-refs $version"
if [[ "$(status https://crates.io/api/v1/crates/git-remote-refs)" == 404 ]]; then
  granted crates-io crates-io || fail "the first crates.io release needs: beepboop secrets grant $repo crates-io --operation release --environment crates-io"
fi
if [[ "$(status https://registry.npmjs.org/git-remote-refs)" == 404 ]]; then
  granted npm-token npm || fail "the first npm release needs: beepboop secrets grant $repo npm-token --operation release --environment npm"
fi
message=("$tag")
[[ -z "$summary" ]] || message+=("$summary")
git tag --sign "$tag" --file <(printf '%s\n\n' "${message[@]}")
git tag --sign "go/$tag" --file <(printf '%s\n\n' "${message[@]}")
git verify-tag "$tag" "go/$tag"
git push --atomic origin "refs/tags/$tag" "refs/tags/go/$tag:refs/pending/go/$tag"
'''
