#:tombi toml-version = "v1.1.0"

[tools]
npm                                = "12"
node                               = "26"
cargo-binstall                     = "1.23.0"
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
"cargo:cargo-nextest"              = "0.9.152"
"npm:tsrs"                         = "7.1.0-beta.tsrs3"
"npm:@kjanat/fmt"                  = {
  version               = "0.64.1",
  trust_policy_excludes = ["@kprint/*", "@kjanat/*"],
  allow_low_downloads   = true,
}

[vars]
target  = "wasm32-unknown-unknown"
profile = "release"
outdir  = "wasm"

[tasks.fmt]
alias = ["f", "format"]
run   = "kfmt"

[tasks.test]
run     = [
  "tsrs --project tsconfig.json",
  "cargo nextest run --workspace",
  "node --test index.test.ts",
]
depends = "build"

[tasks."cargo:build"]
run  = "cargo build --package git-remote-refs-wasm --profile {{vars.profile}} --target {{vars.target}}"
hide = true

[tasks."wasm-bindgen:build"]
run     = "wasm-bindgen --target web --out-dir {{vars.outdir}} target/{{vars.target}}/{{vars.profile}}/git_remote_refs_wasm.wasm"
depends = "cargo:build"
hide    = true

[tasks.build]
run     = "tsrs --project tsconfig.build.json"
depends = "wasm-bindgen:build"
